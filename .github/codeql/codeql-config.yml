name: "CodeQL Security scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: none  # we'll compile explicitly in the next step

      - name: Build Go provider(main module only)
        run: |
          go mod download
          go list ./... | grep -v '^.*/tools/.*$' | xargs -r -n1 go build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
