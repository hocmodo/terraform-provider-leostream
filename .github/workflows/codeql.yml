name: "CodeQL Security scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual # we'll compile explicitly in the next step
          config-file: codeql-config.yml

      - name: Build Go provider(main module only)
        run: |
          go mod download
          go list ./... | grep -v '^.*/tools/.*$' | xargs -r -n1 go build

      - name: Analyze (write SARIF to disk)
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: false          # we will filter first

      - name: Filter SARIF (drop tools/**)
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -tools/**
            **
          input: sarif-results/go.sarif
          output: sarif-results/go.sarif

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/go.sarif
